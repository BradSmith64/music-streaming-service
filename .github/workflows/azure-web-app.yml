name: Build and Deploy Music Streaming Services

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Web API
        run: dotnet build --configuration Release
        working-directory: music-streaming-minimal-api

      - name: Publish Web API
        run: dotnet publish -c Release -r linux-x64 --no-self-contained -o ${{env.DOTNET_ROOT}}/webapi
        working-directory: music-streaming-minimal-api

      - name: Upload Web API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-api-app
          path: ${{env.DOTNET_ROOT}}/webapi

  build_func:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Functions
        run: dotnet build --configuration Release
        working-directory: music-streaming-functions

      - name: Publish Functions
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/func
        working-directory: music-streaming-functions

      - name: Upload Functions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: ${{env.DOTNET_ROOT}}/func

  deploy:
    runs-on: ubuntu-latest
    needs: [build_web, build_func]
    environment:
      name: 'Production'
    
    steps:
      - name: Download Web API Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-api-app
          path: webapi

      - name: Download Functions Artifact
        uses: actions/download-artifact@v4
        with:
          name: function-app
          path: func

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy Web API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: webapi

      - name: Deploy Functions
        uses: azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: func
